name: tail_app_services
description: A server app using the shelf package and Docker.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.12.1

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  wordpress_client: ^9.3.0 # Used for tail blog
  firedart: ^0.9.8
  json_annotation: ^4.12.0
  logging: ^1.3.0
  collection: ^1.19.1 # Priority Queue

  #Dio
  dio: ^5.9.2
  dio_smart_retry: ^7.0.1
  dio_cache_interceptor: ^4.0.6
  http_cache_hive_store: ^5.1.0

  # Hive
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Sentry
  sentry: ^9.21.0 # Base sentry + Flutter integration
  sentry_logging: ^9.21.0 # Collects app logs
  sentry_hive: ^9.21.0 # Collects Hive storage accesses
  sentry_dio: ^9.21.0 # Collects Dio HTTP requests

  json_serializable: ^6.14.0 # required for @JsonSerializable annotations
  tail_app_shared:
    git:
      url: https://github.com/OpenTails/tail_app_shared
dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  test: ^1.31.1
  shelf_router_generator: ^1.1.4
  build_runner: ^2.15.0