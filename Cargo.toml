[package]
name = "tailcompany-wp-proxy"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/OpenTails/tail_app_services"

[dependencies]
base64 = "0.23.1"
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = [
    "gif",
    "jpeg",
    "png",
    "webp",
] }
sentry = { version = "0.49.5", default-features = false, features = [
    "backtrace",
    "contexts",
    "logs",
    "metrics",
    "panic",
    "rustls",
    "tracing",
    "ureq",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thumbhash = "0.1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.5.1"

[profile.release]
lto = true
codegen-units = 1
# Keep the symbol table so Sentry backtraces resolve to function names.
# For line numbers, upload debug files to Sentry instead of stripping.
strip = "debuginfo"
